<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTB Pocket Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="logo-icon">🛡️</span>
        <div>
          <h1>HTB Pocket</h1>
          <span class="subtitle">Firefox Android • v1.0.0</span>
        </div>
      </div>
      <span id="header-status-badge" class="badge badge-idle">Pronto</span>
    </header>

    <!-- Status Atual da Chave -->
    <section class="card status-card">
      <div class="card-label">Status da Chave de API</div>
      <div class="status-row">
        <span id="status-indicator-dot" class="dot dot-unknown"></span>
        <span id="current-key-masked" class="key-masked">Verificando...</span>
      </div>
    </section>

    <!-- Formulário da Chave de API -->
    <section class="card">
      <div class="card-label">Configurar Nova Chave de API</div>
      <div class="input-group">
        <input
          type="password"
          id="api-key-input" aria-label="Nova chave de API"
          placeholder="Insira sua chave (AIzaSy...)"
          autocomplete="off" autocapitalize="none" autocorrect="off"
          spellcheck="false"
        >
        <button type="button" id="toggle-visibility" aria-label="Mostrar chave" aria-pressed="false" class="btn-icon" title="Mostrar/Ocultar caracteres">
          👁️
        </button>
      </div>

      <div class="button-row">
        <button type="button" id="btn-save-key" class="btn btn-primary">
          <span>💾</span> Salvar Chave
        </button>
        <button type="button" id="btn-test-key" class="btn btn-secondary">
          <span>⚡</span> Testar Conexão
        </button>
      </div>

      <div id="api-feedback" role="status" aria-live="polite" class="feedback-box" style="display: none;"></div>
    </section>


    <!-- Glossário Personalizável -->
    <section class="card">
      <div class="card-label">Glossário (Palavras para NÃO traduzir)</div>
      <div class="input-group">
        <textarea id="glossary-input" aria-label="Termos que devem permanecer em inglês" maxlength="2000" rows="2" placeholder="Ex: Payload, Ticket Granting Ticket, Pivoting..." spellcheck="false" style="width: 100%; border-radius: 6px; padding: 8px; font-family: monospace; background: #1a1a2e; color: #fff; border: 1px solid #333; resize: vertical;"></textarea>
      </div>
      <div class="button-row" style="margin-top: 8px;">
        <button type="button" id="btn-save-glossary" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">
          <span>📖</span> Salvar Glossário
        </button>
      </div>
      <div id="glossary-feedback" class="feedback-box" style="display: none; padding: 4px; font-size: 11px; margin-top: 5px;"></div>
    </section>

    <!-- Automação de Seções -->
    <section class="card">
      <div class="toggle-container">
        <div class="toggle-info">
          <span class="toggle-title">Auto-traduzir Seções</span>
          <span class="toggle-desc">Traduz seções seguintes e anteriores automaticamente ao navegar no curso.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="auto-translate-toggle" aria-label="Traduzir seções automaticamente">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Ações Rápidas -->
    <section class="quick-actions">
      <button type="button" id="btn-translate-now" class="btn btn-full btn-accent">
        <span>✨</span> Traduzir Seção Atual na Página
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>Hack The Box Academy • Infosec pt-BR</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
